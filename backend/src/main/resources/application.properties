spring.application.name=backend

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/medichannel_db
spring.datasource.username=postgres
spring.datasource.password=123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT and email hashing secrets
app.security.email-hmac-secret=${MEDICHANNEL_EMAIL_HMAC_SECRET}
app.security.jwt-secret=${MEDICHANNEL_JWT_SECRET_BASE64}

# JWT expires after one hour
app.security.jwt-expiration-ms=3600000

app.security.nic-hmac-secret=${MEDICHANNEL_NIC_HMAC_SECRET}